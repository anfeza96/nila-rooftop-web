:root{

  --sand:#D9A46A; --cream:#F4E9DA; --gold:#E8C24B;
  --paper:#F4E9DA; --ink:#2A1D14;
  --text:#F4E9DA; --muted:#B9A794; --faint:#857463;
  --line:rgba(244,233,218,.16); --line-soft:rgba(244,233,218,.08);
  --ok:#79B58A;
  --gutter:clamp(20px,5vw,60px); --maxw:1200px;
  --f-brand:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --f-body:"Karla","Helvetica Neue",Arial,sans-serif;
  --f-script:"Sacramento","Segoe Script",cursive;
  color-scheme:dark;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:var(--f-body); font-weight:300;
  font-size:clamp(15px,.35vw + 14px,16.5px); line-height:1.7;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
img{ max-width:100%; display:block; }
h1,h2,h3,h4{ font-family:var(--f-brand); font-weight:300; margin:0; line-height:1.1; text-wrap:balance; }
.wrap{ width:100%; max-width:var(--maxw); margin-inline:auto; padding-inline:var(--gutter); }
.mark{ background:var(--gold); color:#1B1408; padding:1px 8px 2px; font-weight:500; }

/* ── fondo vivo (igual que el resto del sitio) ── */
#bg{ position:fixed; inset:-45vh -45vw; z-index:0; pointer-events:none; overflow:hidden; }
#bg b{ position:absolute; display:block; border-radius:50%; filter:blur(72px); will-change:transform; }
#bg .b1{ width:80vw; height:80vw; left:4%;  top:10%; background:radial-gradient(circle, rgba(160,73,46,.85), transparent 66%); }
#bg .b2{ width:64vw; height:64vw; left:60%; top:18%; background:radial-gradient(circle, rgba(217,164,106,.58), transparent 66%); }
#bg .b3{ width:72vw; height:72vw; left:56%; top:30%; background:radial-gradient(circle, rgba(201,102,60,.68), transparent 66%); }
#bg .b4{ width:54vw; height:54vw; left:10%; top:36%; background:radial-gradient(circle, rgba(232,194,75,.32), transparent 66%); }
#bg .b5{ width:76vw; height:76vw; left:50%; top:42%; background:radial-gradient(circle, rgba(124,53,33,.82), transparent 66%); }
#bg .b6{ width:58vw; height:58vw; left:8%;  top:48%; background:radial-gradient(circle, rgba(217,164,106,.48), transparent 66%); }
#bg::after{ content:""; position:absolute; inset:0; background:rgba(21,15,11,.32); }
@media (max-width:700px){ #bg b{ filter:blur(58px); } #bg .b4, #bg .b6{ display:none; } }
@media (prefers-reduced-motion: reduce){ #bg b{ transform:none !important; } }

/* ── NAV ── */
.nav{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:70;
  background:rgba(21,15,11,.72); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid transparent; transition:background .3s, border-color .3s;
}
.nav.stuck{ background:rgba(21,15,11,.95); border-bottom-color:var(--line-soft); }
.nav-in{ display:flex; align-items:center; gap:20px; height:70px; }
.nav-logo{ display:flex; align-items:center; gap:11px; text-decoration:none; color:var(--text); }
.nav-logo svg{ width:26px; height:26px; color:var(--sand); flex:none; }
.nav-logo b{ font-family:var(--f-brand); font-weight:300; font-size:16px; letter-spacing:.34em; padding-left:.34em; }
.nav-links{ display:flex; align-items:center; gap:clamp(15px,1.7vw,26px); margin-left:auto; }
.nav-links a{
  font-family:var(--f-brand); font-size:11.5px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--muted); text-decoration:none; padding:8px 0; transition:color .25s;
}
.nav-links a:hover, .nav-links a[aria-current]{ color:var(--text); }
.nav-cta{
  margin-left:auto; font-family:var(--f-brand); font-size:11.5px; letter-spacing:.18em; text-transform:uppercase;
  text-decoration:none; padding:11px 22px; border:1px solid var(--line); border-radius:999px;
  color:var(--text); transition:background .25s, border-color .25s; white-space:nowrap;
}
.nav-cta:hover{ background:var(--terra); border-color:var(--terra); }
.nav-links + .nav-cta{ margin-left:0; }
@media (max-width:900px){
  .nav-in{ height:auto; flex-wrap:wrap; padding-block:11px; gap:8px 14px; }
  .nav-logo{ order:1; }
  .nav-cta{ order:2; margin-left:auto; padding:13px 18px; }
  .nav-links{
    order:3; width:100%; margin-left:0; gap:12px;
    overflow-x:auto; scrollbar-width:none; padding-bottom:1px;
    -webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);
            mask-image:linear-gradient(90deg,#000 86%,transparent);
  }
  .nav-links::-webkit-scrollbar{ display:none; }
  .nav-links a{ white-space:nowrap; flex:none; font-size:11px; padding:15px 4px; display:flex; align-items:center; }
}
.nav-links a.aparte{
  color:var(--gold); border:1px solid rgba(232,194,75,.45); border-radius:999px;
  padding:6px 15px; margin:-6px 0; background:rgba(232,194,75,.08);
  transition:background .25s, border-color .25s, color .25s;
}
.nav-links a.aparte:hover, .nav-links a.aparte:focus-visible{ background:var(--gold); border-color:var(--gold); color:#1B1408; }
.nav-links a.aparte[aria-current]{ background:var(--gold); border-color:var(--gold); color:#1B1408; }
@media (max-width:900px){ .nav-links a.aparte{ padding:13px 15px; margin:0; } }

/* ── botones ── */
.btn{
  display:inline-flex; align-items:center; gap:10px; cursor:pointer;
  font-family:var(--f-brand); font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:500;
  padding:14px 26px; border-radius:999px; text-decoration:none; border:1px solid transparent;
  transition:transform .18s, background .25s, border-color .25s, color .25s; background:none;
}
.btn:active{ transform:translateY(1px); }
.btn-solid{ background:var(--cream); color:var(--ink); }
.btn-solid:hover{ background:#fff; }
.btn-terra{ background:var(--terra); color:var(--cream); }
.btn-terra:hover{ background:var(--ember); }
.btn-line{ border-color:var(--line); color:var(--text); background:rgba(21,15,11,.35); }
.btn-line:hover{ border-color:var(--cream); }
a:focus-visible, button:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

/* ── CABECERA ── */
.carta-cab{
  position:relative; z-index:1; max-width:var(--maxw); margin-inline:auto; padding:clamp(56px,8vw,96px) var(--gutter) clamp(34px,5vw,52px);
  display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:28px;
}
.carta-cab .izq{ max-width:640px; }
.carta-cab .eyebrow{

  color:var(--sand); font-weight:500; margin:0 0 20px;
}
.carta-cab h1{ font-weight:200; font-size:clamp(52px,10vw,112px); line-height:.92; letter-spacing:.1em; color:var(--text); }
.carta-cab .tag{ font-family:var(--f-script); font-size:clamp(28px,4.4vw,44px); line-height:1.1; color:var(--gold); margin:30px 0 0; }
.carta-cab .lede{ color:var(--muted); font-size:clamp(15.5px,.4vw + 14.5px,18px); max-width:52ch; margin:18px 0 0; text-wrap:pretty; }
.carta-cab .der{ display:flex; flex-direction:column; align-items:flex-start; gap:14px; }
.idioma{ display:flex; padding:4px; border:1px solid var(--line); border-radius:999px; background:rgba(21,15,11,.5); }
.idioma button{
  font-family:var(--f-brand); font-size:11.5px; letter-spacing:.18em; font-weight:500;
  border:0; cursor:pointer; padding:14px 18px; border-radius:999px; background:transparent; color:var(--muted);
  transition:background .25s, color .25s;
}
.idioma button[aria-pressed="true"]{ background:var(--cream); color:var(--ink); }
.alergia{ font-size:13px; color:var(--faint); max-width:34ch; margin:0; }

/* ── BARRA DE PESTAÑAS ── */
.carta-tabs-bar{

}

.carta-tabs{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
.carta-tabs::-webkit-scrollbar{ display:none; }
.carta-tabs button{

  background:transparent; border:0; cursor:pointer; padding:18px 12px 16px; color:var(--muted); font-weight:400;
  border-bottom:2px solid transparent; white-space:nowrap; transition:color .25s, border-color .25s;
}
.carta-tabs button:hover{ color:var(--text); }
.carta-tabs button[aria-selected="true"]{ color:var(--text); font-weight:500; border-bottom-color:var(--gold); }

.carta-cat{ padding-top:clamp(44px,6vw,72px); }
.carta-cat-head{

  padding-bottom:22px; border-bottom:1px solid var(--line);
}
.carta-cat-head .num{ font-family:var(--f-brand); font-size:10.5px; letter-spacing:.32em; text-transform:uppercase; color:var(--gold); font-weight:500; margin:0 0 12px; }
.carta-cat-head h2{ font-size:clamp(32px,5vw,54px); line-height:1.05; letter-spacing:.01em; }

.carta-cuerpo{ display:flex; flex-wrap:wrap; gap:clamp(28px,4vw,56px); align-items:flex-start; margin-top:8px; }
.carta-lista{ flex:1 1 520px; min-width:0; }
.carta-grupo{ margin-top:28px; }
.carta-grupo-tit{ display:flex; align-items:center; gap:14px; margin-bottom:6px; }
.carta-grupo-tit h3{ font-family:var(--f-brand); font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--sand); font-weight:500; }
.carta-grupo-tit span{ flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }
.carta-grupo-nota{ margin-top:16px; font-size:13.5px; color:var(--sand); }
.carta-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr)); column-gap:clamp(28px,4vw,52px); }
.plato{ padding:18px 0 20px; border-bottom:1px solid var(--line-soft); }
.plato .fila{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; }
.plato h4{ font-weight:400; font-size:16px; letter-spacing:.1em; text-transform:uppercase; line-height:1.35; color:var(--text); text-wrap:balance; }
.plato .leader{ flex:1 1 30px; min-width:12px; border-bottom:1px dotted rgba(244,233,218,.22); transform:translateY(-4px); }
.plato .precios{ display:flex; flex-wrap:wrap; gap:6px 16px; flex:0 1 auto; max-width:100%; align-items:baseline; }
.plato .precio{ display:flex; align-items:baseline; gap:6px; }
.plato .precio small{ font-family:var(--f-body); font-size:12px; letter-spacing:.02em; text-transform:none; color:var(--muted); }
.plato .precio .valor{ font-family:var(--f-brand); font-size:16px; font-weight:400; color:var(--gold); white-space:nowrap; }
.plato .insignia{
  display:inline-block; margin-top:8px; background:var(--gold); color:#1B1408;
  font-family:var(--f-brand); font-size:10px; letter-spacing:.22em; text-transform:uppercase; font-weight:500; padding:3px 9px;
}
.plato .desc{ margin-top:7px; color:var(--muted); font-size:14.5px; line-height:1.6; text-wrap:pretty; }

/* ── FOTO DE CATEGORÍA (revelado + parallax, igual que en el resto del sitio) ── */
.carta-foto{ flex:0 1 320px; min-width:240px; margin-top:28px; }
@media (min-width:901px){ .carta-foto{ position:sticky; top:140px; } }
.carta-foto .flyer{ position:relative; overflow:hidden; border-radius:3px; background:var(--ground-3); aspect-ratio:4/5; }
.carta-foto .flyer img{
  position:absolute; left:0; top:-9%; width:100%; height:118%;
  object-fit:cover; will-change:transform;
  transform:translate3d(0, var(--py,0px), 0);
  transition:scale .7s cubic-bezier(.2,.7,.3,1), filter .7s ease;
}
.carta-foto .flyer::after{ content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 1px var(--line-soft); pointer-events:none; z-index:3; }
.carta-foto .flyer::before{
  content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
  background:linear-gradient(104deg, transparent 36%, rgba(244,233,218,.26) 47%, rgba(232,194,75,.16) 52%, transparent 62%);
  transform:translateX(-130%); transition:transform 1s cubic-bezier(.3,.7,.3,1);
}
@media (prefers-reduced-motion: no-preference){
  .js .carta-foto .flyer{ clip-path:inset(0 0 100% 0); transition:clip-path 1.05s cubic-bezier(.16,.84,.26,1); }
  .js .carta-foto .flyer.visto{ clip-path:inset(0 0 0 0); }
  .js .carta-foto .flyer img{ scale:1.12; transition:scale 1.4s cubic-bezier(.16,.84,.26,1), filter .7s ease; }
  .js .carta-foto .flyer.visto img{ scale:1; }
}
.carta-foto .cap{ font-family:var(--f-script); font-size:28px; color:var(--gold); line-height:1; margin:14px 0 0; }

/* ── PAGINADOR ── */
.carta-pag{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; margin-top:48px; }

/* ── BANDA RESERVAS ── */
.carta-banda{
  margin-top:clamp(56px,7vw,88px); padding:clamp(26px,3.6vw,40px);

/* ── PIE ── */
.foot{ border-top:1px solid var(--line-soft); padding-block:34px; background:rgba(21,15,11,.74); position:relative; z-index:1; }

.foot a{ color:inherit; text-decoration:underline; text-underline-offset:2px; }
.foot a:hover{ color:var(--text); }
</style>

<script>
document.documentElement.classList.add('js');

const $  = (s,c=document) => c.querySelector(s);
const $$ = (s,c=document) => [...c.querySelectorAll(s)];
const escapa = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

$('#anio').textContent = new Date().getFullYear();

/* ══════════════════════════════════════════════════════════
   1) Datos
   ══════════════════════════════════════════════════════════ */
let CARTA;
try { CARTA = JSON.parse($('#carta-datos').textContent); }
catch (err){ console.error('No se pudo leer la carta:', err); CARTA = { ui:{es:{},en:{}}, categories:[] }; }

const CATS = CARTA.categories;
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;

let lang = 'es';
try { lang = localStorage.getItem('nila-carta-lang') === 'en' ? 'en' : 'es'; } catch(err){}

const hashInicial = (location.hash || '').slice(1);
let activo = CATS.some(c => c.id === hashInicial) ? hashInicial : (CATS[0] ? CATS[0].id : '');
let cambiando = false;
let temporizador = null;

/* ══════════════════════════════════════════════════════════
   2) Cabecera + idioma
   ══════════════════════════════════════════════════════════ */
function pintarTextosUI(){
  const t = CARTA.ui[lang] || {};
  $('#t-eyebrow').textContent   = t.eyebrow || '';
  $('#t-title').textContent     = t.title || '';
  $('#t-tag').textContent       = t.tag || '';
  $('#t-lede').textContent      = t.lede || '';
  $('#t-allergy').textContent   = t.allergy || '';
  $('#t-evEyebrow').textContent = t.evEyebrow || '';
  $('#t-evText').textContent    = t.evText || '';
  $('#t-reservar').textContent  = t.reservar || '';
  $('#btn-es').setAttribute('aria-pressed', String(lang === 'es'));
  $('#btn-en').setAttribute('aria-pressed', String(lang === 'en'));
  document.title = (t.title || 'Carta') + ' — NILA ROOFTOP';
}
function fijarIdioma(nuevo){
  if (nuevo === lang) return;
  lang = nuevo;
  try { localStorage.setItem('nila-carta-lang', lang); } catch(err){}
  pintarTextosUI();
  pintarTabs();
  pintarCategoria();
}
$('#btn-es').addEventListener('click', () => fijarIdioma('es'));
$('#btn-en').addEventListener('click', () => fijarIdioma('en'));

/* ══════════════════════════════════════════════════════════
   3) Pestañas
   ══════════════════════════════════════════════════════════ */
function pintarTabs(){
  const caja = $('#carta-tabs');
  caja.setAttribute('role','tablist');
  caja.innerHTML = CATS.map(c =>
    '<button type="button" role="tab" data-id="' + c.id + '" aria-selected="' + (c.id === activo) + '">' +
      escapa(c[lang]) +
    '</button>'
  ).join('');
  $$('button', caja).forEach(b => b.addEventListener('click', () => irA(b.dataset.id)));
}
function centrarTab(){
  const caja = $('#carta-tabs');
  const b = caja.querySelector('[data-id="' + activo + '"]');
  if (!b) return;
  caja.scrollTo({ left: b.offsetLeft - caja.clientWidth / 2 + b.offsetWidth / 2, behavior: quieto ? 'auto' : 'smooth' });
}

/* ══════════════════════════════════════════════════════════
   4) Categoría activa
   ══════════════════════════════════════════════════════════ */
function precioHTML(pr){
  const t = CARTA.ui[lang] || {};
  const etq = pr.label === 'copa' ? t.c : pr.label === 'botella' ? t.b : pr.label;
  return '<span class="precio">' +
    (etq ? '<small>' + escapa(etq) + '</small>' : '') +
    '<span class="valor">' + escapa(pr.value) + '</span>' +
  '</span>';
}
function platoHTML(it){
  const t = CARTA.ui[lang] || {};
  const desc = it.desc ? (it.desc[lang] || it.desc.es) : '';
  return '<article class="plato">' +
    '<div class="fila">' +
      '<h4>' + escapa(it.name) + '</h4>' +
      '<span class="leader"></span>' +
      '<div class="precios">' + it.prices.map(precioHTML).join('') + '</div>' +
    '</div>' +
    (it.signature ? '<span class="insignia">' + escapa(t.badge || '') + '</span>' : '') +
    (desc ? '<p class="desc">' + escapa(desc) + '</p>' : '') +
  '</article>';
}
function grupoHTML(g){
  const titulo = g.title ? (g.title[lang] || g.title.es) : null;
  const nota = g.note ? (g.note[lang] || g.note.es) : null;
  return '<div class="carta-grupo">' +
    (titulo ? '<div class="carta-grupo-tit"><h3>' + escapa(titulo) + '</h3><span></span></div>' : '') +
    '<div class="carta-grid">' + g.items.map(platoHTML).join('') + '</div>' +
    (nota ? '<p class="carta-grupo-nota">' + escapa(nota) + '</p>' : '') +
  '</div>';
}
function categoriaHTML(cat, idx){
  const t = CARTA.ui[lang] || {};
  const otro = lang === 'es' ? cat.en : cat.es;
  const num = String(idx + 1).padStart(2, '0');
  const foto = cat.img
    ? '<aside class="carta-foto">' +
        '<div class="flyer" style="aspect-ratio:4/5">' +
          '<img src="' + escapa(cat.img) + '" alt="' + escapa(cat[lang]) + '" loading="eager">' +
        '</div>' +
        (cat.caption ? '<p class="cap">' + escapa(cat.caption) + '</p>' : '') +
      '</aside>'
    : '';
  return '<section class="carta-cat" id="cat-' + cat.id + '">' +
    '<div class="carta-cat-head">' +
      '<div><p class="num">' + num + ' · ' + escapa(otro) + '</p><h2>' + escapa(cat[lang]) + '</h2></div>' +
      '<p class="iva">' + escapa(t.iva || '') + '</p>' +
    '</div>' +
    '<div class="carta-cuerpo">' +
      '<div class="carta-lista">' + cat.groups.map(grupoHTML).join('') + '</div>' +
      foto +
    '</div>' +
  '</section>';
}
function paginadorHTML(idx){
  const t = CARTA.ui[lang] || {};
  const prev = CATS[idx - 1], next = CATS[idx + 1];
  return (
    (prev ? '<button type="button" class="btn btn-line" data-ir="' + prev.id + '">← ' + escapa(prev[lang]) + '</button>' : '<span></span>') +
    (next ? '<button type="button" class="btn btn-terra" data-ir="' + next.id + '">' + escapa(next[lang]) + ' →</button>' : '<span></span>')
  );
}
function pintarCategoria(){
  const idx = Math.max(0, CATS.findIndex(c => c.id === activo));
  const cat = CATS[idx];
  if (!cat) return;
  $('#carta-contenido').innerHTML = categoriaHTML(cat, idx);
  $('#carta-pag').innerHTML = paginadorHTML(idx);
  $$('[data-ir]', $('#carta-pag')).forEach(b => b.addEventListener('click', () => irA(b.dataset.ir)));
  refrescarFotos();
}

   5) Cambiar de categoría (con fundido)
   ══════════════════════════════════════════════════════════ */
function irA(id){
  if (id === activo || cambiando) return;
  cambiando = true;
  history.replaceState(null, '', '#' + id);
  const caja = $('#carta-contenido');
  caja.classList.add('fading');
  clearTimeout(temporizador);
  temporizador = setTimeout(() => {
    activo = id;
    pintarTabs();
    pintarCategoria();
    caja.classList.remove('fading');
    centrarTab();
    const barra = $('.carta-tabs-bar');
    const delta = caja.getBoundingClientRect().top - barra.getBoundingClientRect().bottom;
    if (Math.abs(delta) > 4) window.scrollTo({ top: window.scrollY + delta, behavior: 'auto' });
    cambiando = false;
  }, quieto ? 0 : 180);
}

/* ══════════════════════════════════════════════════════════
   6) Fotos de categoría: revelado + parallax (igual que el resto del sitio)
   ══════════════════════════════════════════════════════════ */
let marcos = [];
function refrescarFotos(){
  marcos = $$('.carta-foto .flyer');
  if (quieto || !('IntersectionObserver' in window)){
    marcos.forEach(m => m.classList.add('visto'));
  } else {
    const io = new IntersectionObserver((es,obs) => es.forEach(en => {
      if (en.isIntersecting){ en.target.classList.add('visto'); obs.unobserve(en.target); }
    }), { rootMargin:'0px 0px -8% 0px', threshold:.12 });
    marcos.forEach(m => io.observe(m));
    setTimeout(() => marcos.forEach(m => m.classList.add('visto')), 3000);
  }
  mover();
}
let pendiente = false;
function mover(){
  pendiente = false;
  const alto = window.innerHeight;
  if (!alto) return;
  for (const m of marcos){
    const img = m.querySelector('img');
    if (!img) continue;
    const r = m.getBoundingClientRect();
    if (!r.height) continue;
    if (r.bottom < -80 || r.top > alto + 80) continue;
    const avance = (r.top + r.height) / (alto + r.height);
    img.style.setProperty('--py', ((1 - avance * 2) * r.height * 0.075).toFixed(1) + 'px');
  }
}
function pedirMover(){ if (!pendiente){ pendiente = true; requestAnimationFrame(mover); } }

/* Precarga silenciosa de las demás fotos de categoría: así, al tocar
   cualquier pestaña, la imagen ya está en la caché del navegador y
   aparece casi al instante en vez de esperar la descarga. Se hace de
   a una, en cuanto el navegador está libre, para no competir con la
   carga inicial de la página. */
function precargaFotos(){
  if (quieto) return;
  const listos = new Set([activo]);
  const pendientes = CATS.filter(c => c.img && !listos.has(c.id)).map(c => c.img);
  let i = 0;
  function siguiente(){
    if (i >= pendientes.length) return;
    const img = new Image();
    img.onload = img.onerror = () => (window.requestIdleCallback || setTimeout)(siguiente);
    img.src = pendientes[i++];
  }
  (window.requestIdleCallback || setTimeout)(siguiente, { timeout: 2000 });
}

/* ══════════════════════════════════════════════════════════
   7) Fondo vivo y nav (igual que el resto del sitio)
   ══════════════════════════════════════════════════════════ */
(function fondoVivo(){
  const root = document.documentElement;
  if (quieto) return;
  const FOCOS = [
    { s:'.b1', ax:26, ay:20, fx:1.0, fy:0.7, px:0.00, py:0.00, gx: 1, esc:.20, giro: 26 },
    { s:'.b2', ax:32, ay:24, fx:0.7, fy:1.2, px:1.90, py:0.80, gx:-1, esc:.16, giro:-34 },
    { s:'.b3', ax:29, ay:18, fx:1.4, fy:0.9, px:3.10, py:2.20, gx:-1, esc:.22, giro: 40 },
    { s:'.b4', ax:34, ay:26, fx:0.9, fy:1.5, px:0.90, py:4.00, gx: 1, esc:.18, giro:-22 },
    { s:'.b5', ax:24, ay:22, fx:1.2, fy:0.6, px:4.40, py:1.40, gx:-1, esc:.24, giro: 30 },
    { s:'.b6', ax:36, ay:20, fx:0.6, fy:1.1, px:2.40, py:3.30, gx: 1, esc:.14, giro:-18 }
  ];
  FOCOS.forEach(f => { f.el = document.querySelector('#bg ' + f.s); });
  const TAU = Math.PI * 2;
  let destino = 0, actual = 0, corriendo = false, t0 = performance.now();
  function medir(){ destino = window.scrollY || 0; arrancar(); }
  function arrancar(){ if (!corriendo){ corriendo = true; requestAnimationFrame(animar); } }
  function animar(ahora){
    actual += (destino - actual) * 0.085;
    const enMov = Math.abs(destino - actual) > 0.4;
    if (!enMov) actual = destino;
    const alto = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    const p = Math.min(1, Math.max(0, actual / alto));
    const t = (ahora - t0) / 1000;
    for (const f of FOCOS){
      if (!f.el) continue;
      const x = f.gx * f.ax * Math.sin(p * f.fx * TAU + f.px + t * 0.05);
      const y =        f.ay * Math.cos(p * f.fy * TAU + f.py + t * 0.04);
      const e = 1 + f.esc * Math.sin(p * TAU + f.px);
      f.el.style.transform = 'translate3d(' + x.toFixed(2) + 'vw,' + y.toFixed(2) + 'vh,0) rotate(' +
        (f.giro * p).toFixed(1) + 'deg) scale(' + e.toFixed(3) + ')';
    }
    if (enMov) requestAnimationFrame(animar);
    else { corriendo = false; setTimeout(arrancar, 90); }
  }
  addEventListener('scroll', medir, { passive:true });
  addEventListener('resize', medir, { passive:true });
  medir();
})();

addEventListener('scroll', () => {
  $('#nav').classList.toggle('stuck', scrollY > 40);
  pedirMover();
}, { passive:true });
addEventListener('resize', pedirMover, { passive:true });

/* Arranque */
pintarTextosUI();
pintarTabs();
pintarCategoria();
centrarTab();
precargaFotos();
</script>
